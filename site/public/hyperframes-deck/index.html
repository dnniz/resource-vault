<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presentar con HyperFrames</title>

    <script src="./vendor/hyperframes-player.global.js"></script>
    <script src="./vendor/hyperframes-slideshow.global.js"></script>

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #07080c; }
    </style>
  </head>
  <body>
    <!--
      tabindex="0" es obligatorio: <hyperframes-slideshow> escucha keydown
      sobre sí mismo. Sin focus, las flechas mueren.
    -->
    <hyperframes-slideshow
      tabindex="0"
      notes-storage-key="curso-hyperframes-oficio-v1"
      style="display: block; position: relative; width: 100vw; height: 100vh"
    >
      <hyperframes-player
        interactive
        style="position: absolute; inset: 0"
        src="composition/index.html"
      ></hyperframes-player>

      <!--
        ISLA DUPLICADA — el componente lee desde su propio innerHTML, no desde
        la composición que carga el player. Cada cambio en slides/fragments/
        hotspots/sequences hay que replicarlo acá.
      -->
      <script type="application/hyperframes-slideshow+json">
        {
          "slides": [
            { "sceneId": "portada", "notes": "Abrí con el giro: no es un curso de HyperFrames, es un curso de presentar. El deck muestra los componentes, no los describe." },
            { "sceneId": "error-comun", "notes": "Esta es la tesis del curso. Dejala en pantalla. La animación decorativa es el ruido más caro." },
            { "sceneId": "circuito", "notes": "Cinco pasos. Lo importante: el paso 3 es donde se define todo, y casi todos lo saltean." },
            { "sceneId": "identidad", "notes": "Revela las dos reglas. La del test es la que la gente recuerda: si podes escribir #333, te saltaste el paso.", "fragments": [33.4, 34.1] },
            { "sceneId": "layout", "notes": "El consejo mas rentable del oficio. Si sacar la animacion no cambia lo que se entiende, la animacion sobra.", "fragments": [45.4, 46.2] },
            { "sceneId": "catalogo-mapa", "notes": "El mapa mental: seis familias de componentes. La rama tiene el inventario completo con los nombres exactos.", "fragments": [61.5] },
            { "sceneId": "ej-chart", "notes": "Ahi esta el componente renderizado, no descrito. Fijate que el dato reemplaza a la afirmacion.", "fragments": [74.5] },
            { "sceneId": "ej-terminal", "notes": "Cuando la slide muestra codigo, no lo escribas: terminalizalo. El bloque es determinista." },
            { "sceneId": "ej-mockup", "notes": "Mostrar la interfaz real dentro de un marco de navegador. Ojo con el crop: contain, no cover, si hay texto.", "fragments": [102.5] },
            { "sceneId": "ej-destacado", "notes": "Este es el reemplazo correcto de la animacion decorativa: el texto ya esta, una palabra se enciende." },
            { "sceneId": "esqueleto", "notes": "El motor de las partes 3 y 4 del curso. Seis partes, cinco slots por elemento." },
            { "sceneId": "deck-o-video", "notes": "La decision previa. Si lo mira alguien sin que estes, es video. Si tenes que argumentar, es deck." },
            { "sceneId": "arquitectura", "notes": "Solo para los curiosos. Seek-safe es la columna vertebral: el motor no reproduce la linea de tiempo, la posiciona.", "fragments": [152.5] },
            { "sceneId": "cierre", "notes": "Cerrá con la regla, no con features. 22 prompts copiables en las partes 3 y 4." }
          ],
          "slideSequences": [
            {
              "id": "inventario",
              "label": "Inventario del catálogo",
              "slides": [
                { "sceneId": "inv-1", "notes": "Los nombres exactos importan: nombrar el bloque en el prompt fija la tecnica." },
                { "sceneId": "inv-2", "notes": "Cuando construir a mano: diagramas propios, replicaciones de referencia, tipografia muy particular.", "fragments": [190.5] }
              ]
            }
          ]
        }
      </script>
    </hyperframes-slideshow>
    <!-- El ícono de Present lo renderiza el propio componente. -->
  </body>
</html>

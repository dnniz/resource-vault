id: el-curso-del-agua
title: "El Curso del Agua: la arquitectura que hace que un agente no invente"
type: course
language: es
summary: "Qué pasa cuando un bot con herramientas contesta un precio inventado, y la solución no es rezarle al prompt: es una arquitectura de cuatro IAs (router, principal, extractor de parámetros y fact-checker) sobre una memoria de resultados. El diario de construcción de Haiku, reorganizado como curso: confiabilidad del agente, detalles de oficio, nichificación por tipo de problema, positioning y un sistema operativo de-fundador."
tags: [ia, agentes, n8n, arquitectura, prompting, confiabilidad, producto, nichos, ventas, founder]
source:
  url: https://elcursodelagua.substack.com
  author: "Stiven Rosales — newsletter El Curso del Agua"
  captured: 2026-10-12
  credits: >-

    Curso del Agua» de Stiven Rosales (elcursodelagua.substack.com,
    dic 2025 – may 2026), archivadas con fines de estudio personal. Las
    anécdotas técnicas, los nombres del producto (Haiku) y las citas textuales
    pertenecen al autor original. La reorganización en módulos, los objetivos y
    el material de referencia son trabajo de esta bóveda. No es contenido
    original de este repositorio.

schema: vault/v1
id: laboratorio-de-crecimiento
title: "Laboratorio de crecimiento: el sistema comercial que se puede auditar"
type: course
language: es
summary: "Cómo pasar de una libreta de leads a un sistema comercial trazable: eventos en vez de estados, listas cerradas, una sola fuente de verdad y un «contexto que viaja» con cada seguimiento. Siete fases de punta a punta con sus campos, KPIs y umbrales, el ciclo semanal del laboratorio de crecimiento (hipótesis, una variable, experimento) y el stack mínimo de datos para arrancar mañana."
tags: [ventas, growth, crm, pipeline, operaciones, experiments, saas, agency, kpis]
source:

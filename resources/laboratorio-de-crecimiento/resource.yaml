  author: "Libia / AZXION — documento interno de uso exclusivo, sin fuente pública"
  captured: 2026-10-12
  credits: >-
    Curso estructurado a partir de dos documentos operativos internos del
    sistema LIB.SYS / AZXION: el «Proceso comercial» v2026.05 y el «SOP
    Laboratorio de Crecimiento adaptable a cualquier negocio» v1.0. Archivados
    con fines de estudio personal. Los campos, umbrales, taxonomías y
    procedimientos pertenecen al autor original. La reorganización en módulos,
    los objetivos y las plantillas son trabajo de esta bóveda. Documento de uso
    interno: no es contenido original de este repositorio.
